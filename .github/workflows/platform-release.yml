name: Build Strique installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version, for example 0.1.0
        required: true
        type: string
      update_base_url:
        description: Optional HTTPS distribution base; leave empty before hosting is configured
        required: false
        type: string
permissions:
  contents: read
# Serialize publication for the same version; never cancel an upload in progress.
concurrency:
  group: strique-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate product version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Product version must be X.Y.Z' >&2
            exit 1
          fi
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      UPDATE_BASE_URL: ${{ inputs.update_base_url }}
      UPDATE_PUBLIC_KEY: ${{ vars.STRIQUE_UPDATE_PUBLIC_KEY }}
      DSH_TELEMETRY_DISABLED: '1'
      STRIQUE_TEST_NETWORK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential musl-tools
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Prepare and build pinned source dependencies
        env:
          STRIQUE_BUILD_HOME: ${{ runner.temp }}/strique-build-home
        run: node setup/setup.mjs --mode source --home "${{ runner.temp }}/strique-build-home"
      - name: Test packaging and update verification
        run: node --test setup/standalone/tests.mjs setup/standalone/prepare-release.test.mjs
      - name: Build and smoke platform package
        run: node setup/standalone/ci-build.mjs
      - name: Retain installers and portable update archive
        uses: actions/upload-artifact@v4
        with:
          name: strique-${{ matrix.target }}
          path: |
            standalone-output/*.exe
            standalone-output/*.pkg
            standalone-output/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish public installer downloads
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: strique-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and generate checksums
        run: node setup/standalone/prepare-release.mjs "$RELEASE_VERSION" release-assets
      - name: Publish installers and portable archives
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Download the file for your operating system under **Assets**. No GitHub account is required for downloads from this public repository.

          | Platform | Installer |
          | --- | --- |
          | Windows x64 | strique-${RELEASE_VERSION}-win32-x64.exe |
          | macOS Apple Silicon | strique-${RELEASE_VERSION}-darwin-arm64.pkg |
          | macOS Intel | strique-${RELEASE_VERSION}-darwin-x64.pkg |
          | Linux x64 | strique-${RELEASE_VERSION}-linux-x64.tar.gz |
          | Linux ARM64 | strique-${RELEASE_VERSION}-linux-arm64.tar.gz |

          Portable archives for all five platforms and SHA256SUMS.txt are also attached. Each package bundles Node, Harness, and all eight configured Strique plugins.

          On Linux, extract the archive and run ./install.sh. See the [installation instructions](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/setup/standalone/README.md#install-and-launch) for all platforms.

          These are unsigned development installers. Signed application updates require a separately configured HTTPS feed and verification key.

          Built from commit ${GITHUB_SHA}. [Build run](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          # Keep partial uploads hidden. Existing releases fail instead of being overwritten.
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Strique ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$tag" --draft=false --latest
          echo "Download: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
